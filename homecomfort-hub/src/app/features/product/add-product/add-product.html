<form [formGroup]="productForm" (ngSubmit)="onSubmit()" class="product-form">
  <label>
    Name
    <input type="text" formControlName="name">
  </label>

  <label>
    Price
    <input type="number" formControlName="price">
  </label>

  <label>
    Image URL
    <input type="text" formControlName="image">
  </label>

  <label>
    Description
    <textarea formControlName="description"></textarea>
  </label>
<label>
  Amazon Link (optional)
  <input type="text" formControlName="amazonLink">
</label>

<label>
  Flipkart Link (optional)
  <input type="text" formControlName="flipkartLink">
</label>
  <label>
    Category
    <select formControlName="categoryId">
      <option [ngValue]="0" disabled>Select a category</option>
      <option *ngFor="let cat of categories" [ngValue]="cat.id">{{ cat.name }}</option>
    </select>
  </label>
<label>
  Rating (optional)
  <input type="number" step="0.1" min="0" max="5" formControlName="rating">
</label>

<label>
  Review Summary (optional)
  <textarea formControlName="reviewSummary" placeholder="e.g. Praised for durability, some complaints about noise level"></textarea>
</label>

  <button type="submit" [disabled]="productForm.invalid">Add Product</button>
</form>
